name = "leledan-ws"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]
main = ".output/server/index.mjs"

# Plain configuration only. This file is committed, so nothing here may be a
# credential: secrets go in .dev.vars locally (gitignored) and as Worker
# secrets in production, via `wrangler secret put`. See README / the deploy
# notes for the full list.
#
# During local development .dev.vars takes precedence over these, so the
# production PUBLIC_ORIGIN below does not leak into a local run.
[vars]
# Used to build the Stripe/PayPal return URLs. Set explicitly rather than
# left to be derived from the request's Host header, which is attacker-
# controllable in principle -- a spoofed Host would send a paying customer
# somewhere else on return.
PUBLIC_ORIGIN = "https://leledanbuilds.com"

# PayPal environment. Swap to https://api-m.paypal.com when moving off
# sandbox -- the client id/secret must be swapped in the same breath, since
# sandbox credentials are rejected by the live host and vice versa.
PAYPAL_API_BASE = "https://api-m.sandbox.paypal.com"

# Identifies which webhook subscription a delivery belongs to; PayPal's
# signature verification call takes it as a parameter. It is an identifier,
# not a credential -- it grants nothing on its own -- so it is fine in a
# committed file, unlike PAYPAL_CLIENT_SECRET.
PAYPAL_WEBHOOK_ID = "94G23555DB412604F"

[assets]
directory = ".output/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "leledan-builds"
database_id = "9dbc22b2-8149-448d-a15d-2ec1ec011cd9"
migrations_dir = "server/database/migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "leledan-uploads"
